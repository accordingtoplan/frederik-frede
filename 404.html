  <style>
    body { min-height: 100vh; display: flex; flex-direction: column; }

    .nf-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 48px 24px 80px;
    }

    /* Breathing visual */
    .breath {
      position: relative;
      width: 240px;
      height: 240px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
    }
    .breath-ring {
      position: absolute;
      border-radius: 50%;
      border: 1.5px solid var(--grey-light);
      animation: breathe 9s ease-in-out infinite;
    }
    .breath-ring.r1 { width: 80px;  height: 80px;  opacity: 0.9; }
    .breath-ring.r2 { width: 80px;  height: 80px;  opacity: 0.5; animation-delay: 0.18s; }
    .breath-ring.r3 { width: 80px;  height: 80px;  opacity: 0.25; animation-delay: 0.36s; }
    .breath-core {
      width: 9px; height: 9px; border-radius: 50%;
      background: var(--grey-dark);
      animation: breathe-core 9s ease-in-out infinite;
    }
    @keyframes breathe {
      0%, 100% { transform: scale(1);   opacity: 0.18; }
      45%      { transform: scale(2.9); }
      50%      { transform: scale(3);   opacity: 0.9; }
      95%      { opacity: 0.18; }
    }
    @keyframes breathe-core {
      0%, 100% { transform: scale(1);   opacity: 0.5; }
      50%      { transform: scale(1.5); opacity: 1; }
    }
    .breath-label {
      position: absolute;
      bottom: -28px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: var(--grey-light);
      white-space: nowrap;
    }
    .breath-label span { opacity: 0; animation: phase 9s ease-in-out infinite; }
    .breath-label .in  { animation-delay: 0s; }
    .breath-label .out { animation-delay: 4.5s; }
    @keyframes phase {
      0%, 6%   { opacity: 0; }
      12%, 38% { opacity: 1; }
      44%, 100%{ opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .breath-ring, .breath-core, .breath-label span { animation: none; }
      .breath-ring.r1 { transform: scale(2.6); opacity: 0.5; }
      .breath-ring.r2, .breath-ring.r3 { display: none; }
      .breath-label .in { opacity: 1; }
    }

    .nf-num {
      margin-top: 56px;
      font-size: clamp(48px, 8vw, 100px);
      font-weight: 700;
      line-height: 0.91;
      letter-spacing: -0.035em;
      color: var(--grey-dark);
    }
    .nf-sub {
      margin-top: 14px;
      font-size: clamp(16px, 2vw, 22px);
      font-weight: 700;
      letter-spacing: -0.015em;
      color: var(--grey-mid);
      max-width: 460px;
    }

    /* Search */
    .nf-search { position: relative; width: 100%; max-width: 420px; margin-top: 40px; }
    .nf-input {
      width: 100%;
      font-family: var(--font);
      font-size: 15px;
      font-weight: 700;
      color: var(--grey-dark);
      background: var(--bg-card);
      border: none;
      border-radius: 4px;
      padding: 14px 16px;
      outline: none;
    }
    .nf-input::placeholder { color: var(--grey-light); font-weight: 700; }
    .nf-results {
      position: absolute;
      left: 0; right: 0; top: calc(100% + 6px);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      max-height: 280px;
      overflow-y: auto;
      text-align: left;
      display: none;
      z-index: 20;
    }
    .nf-results.show { display: block; }
    .nf-result {
      display: block;
      padding: 11px 16px;
      font-size: 14px;
      font-weight: 700;
      color: var(--grey-mid);
      text-decoration: none;
      border-bottom: 1px solid var(--bg-card);
    }
    .nf-result:last-child { border-bottom: none; }
    .nf-result:hover, .nf-result.active { background: var(--bg-card); color: var(--grey-dark); }
    .nf-empty { padding: 14px 16px; font-size: 14px; font-weight: 700; color: var(--grey-light); }

    .nf-links { margin-top: 32px; display: flex; gap: 6px; font-size: 13px; font-weight: 700; }
    .nf-links a { color: var(--grey-light); text-decoration: none; }
    .nf-links a:hover { color: var(--grey-dark); }
    .nf-links span { color: var(--grey-light); }

    /* Work strip */
    .nf-work { padding: 8px 48px 80px; }
    .nf-work-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 24px;
    }
    .nf-work-label {
      font-size: 11px; font-weight: 700;
      letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--grey-dark);
    }
    .nf-work-all {
      font-size: 11px; color: var(--grey-light);
      text-decoration: none; letter-spacing: 0.04em;
      transition: color 0.2s;
    }
    .nf-work-all:hover { color: var(--grey-mid); }
    .nf-work-all::after { content: ' →'; }
    .nf-work-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 24px;
    }
    .nf-card { text-decoration: none; display: block; }
    .nf-card-media {
      width: 100%;
      aspect-ratio: 4 / 3;
      overflow: hidden;
      border-radius: 4px;
      background: var(--bg-card);
    }
    .nf-card-media video {
      width: 100%; height: 100%;
      object-fit: cover; display: block;
      transition: transform 0.5s ease;
    }
    .nf-card:hover .nf-card-media video { transform: scale(1.03); }
    .nf-card-row {
      display: flex; flex-direction: column;
      gap: 2px; margin-top: 12px;
    }
    .nf-card-b {
      font-size: 12px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.02em;
      color: var(--grey-dark);
    }
    .nf-card-t {
      font-size: 12px; font-weight: 700;
      color: var(--grey-mid);
    }

    @media (max-width: 900px) {
      .nf-work-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 640px) {
      .nf-work { padding: 8px 24px 64px; }
      .nf-work-grid { grid-template-columns: 1fr; }
    }

    .nf-more {
      display: block;
      width: fit-content;
      margin: 40px auto 0;
      padding: 12px 28px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;

      border: 1.5px solid var(--grey-dark);
      border-radius: 999px;
      transition: background 0.2s, color 0.2s;
    }
    .nf-more::after { content: ' →'; }
    .nf-more:hover { background: var(--grey-dark); color: var(--bg); }

    const box   = document.getElementById('nfResults');
    let active = -1, current = [];

    function render(list) {
      current = list;
      active = -1;
      if (!list.length) {
        box.innerHTML = '<div class="nf-empty">Nothing by that name. Try the work archive.</div>';
        box.classList.add('show');
        return;
      }
      box.innerHTML = list.slice(0, 8).map(function(p, i){
        return '<a class="nf-result" data-i="' + i + '" href="' + p.u + '">' + p.t + '</a>';
      }).join('');
      box.classList.add('show');
    }

    input.addEventListener('input', function(){
      const q = input.value.trim().toLowerCase();
      if (!q) { box.classList.remove('show'); box.innerHTML = ''; return; }
      const hits = PAGES.filter(function(p){ return p.t.toLowerCase().indexOf(q) !== -1; })
                        .sort(function(a, b){
                          return a.t.toLowerCase().indexOf(q) - b.t.toLowerCase().indexOf(q);
                        });
      render(hits);
    });

    input.addEventListener('keydown', function(e){
      const items = box.querySelectorAll('.nf-result');
      if (e.key === 'ArrowDown') { e.preventDefault(); active = Math.min(active + 1, items.length - 1); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); active = Math.max(active - 1, 0); }
      else if (e.key === 'Enter') {
        if (active >= 0 && items[active]) { window.location.href = items[active].getAttribute('href'); }
        else if (items[0]) { window.location.href = items[0].getAttribute('href'); }
        return;
      } else { return; }
      items.forEach(function(el){ el.classList.remove('active'); });
      if (items[active]) { items[active].classList.add('active'); items[active].scrollIntoView({block:'nearest'}); }
    });

    document.addEventListener('click', function(e){
      if (!e.target.closest('.nf-search')) { box.classList.remove('show'); }
    });
